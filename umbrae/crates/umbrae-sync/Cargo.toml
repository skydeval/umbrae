[package]
name = "umbrae-sync"
description = "Sync for atproto spaces apps: credentials, writer sets, repos, op logs and notifications, over a transport the caller supplies"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
umbrae-core = { path = "../umbrae-core" }
umbrae-lexicons = { path = "../umbrae-lexicons" }
